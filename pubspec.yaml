# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  go_router: ^18.0.1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_widget_from_html: ^0.17.4
  flutter_local_notifications: ^22.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  assets:
  #   - assets/images/
    - .env
